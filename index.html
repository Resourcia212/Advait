s",description:{en:"Porcelain veneers, clinical teeth bleaching, tooth jewellery, and tailored smile makeovers.",mr:"व्हिनिअर्स, दात शुभ्र करणे, टूथ ज्वेलरी आणि आकर्षक हास्याची पुनर्रचना."}},{id:"restorative",name:"Restorative & General Dentistry",nameMarathi:"रिस्टोरेटिव्ह व सामान्य दंतोपचार",icon:"Hammer",description:{en:"Root Canal Treatment (RCT), crowns, bridges, ultrasonic cleanings, fillings, and extractions.",mr:"रूट कॅनॉल (RCT), दर्जेदार क्राउन्स, पक्के ब्रीज, दात साफ करणे व सामान्य उपचार."}}],Sd=[{id:"dental-implants-service",name:"Dental Implants",nameMarathi:"दंत रोपण (Dental Implants)",category:"implantology",shortDescription:{en:"Bio-compatible titanium artificial roots surgically placed into the jawbone to permanently hold crowns, bridges, or overdentures.",mr:"जबड्याच्या हाडामध्ये टायटॅनियम स्क्रू बसवून त्यावर नैसर्गिक दातासारखा पक्का दात बसवण्याचा आधुनिक उपचार."},fullDescription:{en:"Dental implants fuse directly with the jawbone (osseointegration), mimicking natural tooth roots. They do not require grinding neighboring teeth and preserve bone from shrinking over time.",mr:"शेजारील दातांना हात न लावता एका किंवा अनेक दातांच्या जागी कायमस्वरूपी नवीन दात रोपणे."},indications:{en:["Single missing tooth","Multiple missing teeth","Complete tooth loss desiring fixed teeth","Unstable removable dentures"],mr:["एक गहाळ दात","अनेक दात पडलेले असणे","कायमस्वरूपी पक्के दात हवे असल्यास"]},keyHighlights:{en:["Lifelong permanent solution","Zero trimming of adjacent healthy teeth","Prevents jawbone shrinkage"],mr:["कायमस्वरूपी उपाय","शेजारचे दात घासण्याची गरज नाही","हाडांची झीज रोखते"]},iconName:"ShieldCheck",isFeatured:!0},{id:"implant-supported-prosthetics",name:"Implant-Supported Overdentures",nameMarathi:"इम्प्लांट सपोर्टेड ओव्हरडेंचर्स (Implant Overdentures)",category:"implantology",shortDescription:{en:"Snap-on overdentures firmly anchored onto 2 to 4 dental implants for rock-solid stability and chewing power.",mr:"२ ते ४ इम्प्लांट्सवर लॉक होणारी कवळी, जी खाताना किंवा बोलताना अजिबात हलत नाही."},fullDescription:{en:"Combines the affordability of dentures with the stability of implants. Locator attachments lock the denture firmly in place, eliminating the need for messy denture adhesives.",mr:"कवळीला खाली न निसटू देणारा व चघळण्याची ताकद वाढवणारा सुरक्षित पर्याय."},indications:{en:["Loose lower dentures","Flat jaw ridge with poor suction","Desire for firm, non-slipping teeth"],mr:["हलणारी खालची कवळी","हाड झिजल्यामुळे सक्शन नसणे"]},keyHighlights:{en:["Snaps securely in and out for cleaning","No messy denture adhesives needed","Significantly increases chewing force"],mr:["स्वच्छतेसाठी सहज काढता-घालता येते","गम किंवा पेस्टची गरज नाही","उत्तम चघळण्याची ताकद"]},iconName:"Award",isFeatured:!0},{id:"complete-dentures",name:"Complete Dentures (बसिसी)",nameMarathi:"संपूर्ण कवळी - बसिसी (Complete Dentures)",category:"implantology",shortDescription:{en:"Precision-molded full-arch removable prostheses replacing all upper or lower missing teeth.",mr:"वरच्या किंवा खालच्या सर्व दात नसलेल्या जबड्यासाठी बसवली जाणारी संपूर्ण कवळी (बसिसी)."},fullDescription:{en:"Fabricated using high-impact acrylic resin, custom border molding, and anatomical tooth arrangement to maximize suction, stability, facial fullness, and chewing efficiency.",mr:"तोंडाच्या अचूक मापाने तयार केलेली, चेहऱ्याला सुरकुत्या पडू न देणारी आणि खाणे सुलभ करणारी कवळी."},indications:{en:["Complete loss of upper and/or lower teeth (edentulism)","Collapsed facial profile due to missing teeth"],mr:["सर्व दात गहाळ असणे","दात नसल्यामुळे चेहरा आकसलेला दिसणे"]},keyHighlights:{en:["Custom border molding for suction","Anatomical tooth arrangement","Restores speech and chewing"],mr:["सक्शन ग्रिप","नैसर्गिक दातांची रचना","बोलणे व खाणे सोपे"]},iconName:"Layers",isFeatured:!0},{id:"full-mouth-rehabilitation-service",name:"Full Mouth Rehabilitation",nameMarathi:"संपूर्ण दातांची पुनर्रचना (Full Mouth Rehabilitation)",category:"implantology",shortDescription:{en:"Complete restorative overhaul reconstructing all upper and lower teeth, restoring bite height and joint harmony.",mr:"सर्व दातांची, जबड्याच्या सांध्याची आणि चाव्याच्या उंचीची संपूर्ण शास्त्रीय पुनर्रचना."},fullDescription:{en:"Dr. Shinde leverages advanced prosthodontic principles using facebow transfers, semi-adjustable articulators, crowns, bridges, and implants to completely rebuild collapsed bites and worn dentitions.",mr:"घसलेले दात, वेदना आणि चावण्यास असमर्थ जबड्यासाठी सर्व दातांची नव्याने नियोजनबद्ध पुनर्रचना."},indications:{en:["Severe tooth attrition/wear from grinding","Collapsed bite vertical dimension","Multiple failed restorations and missing teeth"],mr:["अतिशय झिजलेले दात","चावा बसलेला असणे","अनेक दात तुटलेले व पडलेले असणे"]},keyHighlights:{en:["Comprehensive prosthodontic diagnostics","Restores youthful facial profile","Pain-free joint function"],mr:["अचूक प्रोस्थोडॉन्टिक नियोजन","चेहऱ्याचे सौंदर्य पूर्ववत","सांधेदुखीपासून मुक्ती"]},iconName:"Layers",isFeatured:!0},{id:"overdentures",name:"Overdentures",nameMarathi:"ओव्हर डेंचर्स (Overdentures)",category:"implantology",shortDescription:{en:"Removable dentures supported and stabilized over remaining natural roots or dental implant attachments.",mr:"उरलेल्या मूळ दातांवर किंवा इम्प्लांट्सवर घट्ट लॉक होणारी विशेष ओव्हरडेंचर कवळी."},fullDescription:{en:"Preserves underlying bone by anchoring over treated roots or locators attached to dental implants, dramatically increasing biting force, stability, and patient satisfaction.",mr:"कवळी निसटू नये म्हणून मुळांवर किंवा इम्प्लांटवर क्लिपसारखी घट्ट बसते, ज्यामुळे जबड्याचे हाड झिजत नाही."},indications:{en:["Loose conventional lower denture","Few remaining sturdy natural roots","Implant-retained denture therapy"],mr:["खालची कवळी वारंवार निसटणे","काही मजबूत मुळे शिल्लक असणे","इम्प्लांट सपोर्टेड सोल्यूशन"]},keyHighlights:{en:["Superior retention & stability","Preserves alveolar bone ridge","No embarrassing slippage while talking"],mr:["उत्तम ग्रिप व पकड","हाडांची झीज थांबते","बोलताना कवळी पडत नाही"]},iconName:"CheckCircle2"},{id:"cast-partial-dentures",name:"Cast Partial Dentures (अंशिक कवळी)",nameMarathi:"कास्ट पार्शिअल डेंचर्स - अंशिक कवळी (Cast Partial)",category:"implantology",shortDescription:{en:"Metal framework partial dentures with precise clasps for maximum retention and stability when several teeth remain.",mr:"धातूच्या मजबूत फ्रेमवर तयार केलेली, उरलेल्या दातांच्या आधारे घट्ट बसणारी अंशिक कवळी."},fullDescription:{en:"Engineered with medical-grade cobalt-chromium alloy frameworks and acrylic teeth, distributing occlusal forces evenly onto remaining abutment teeth and the alveolar ridge.",mr:"साध्या कवळीपेक्षा अधिक पातळ, मजबूत आणि खाताना अजिबात न हलणारी टिकाऊ कवळी."},indications:{en:["Multiple missing teeth in one arch","Need for high stability and strength","Alternative to long-span fixed bridges"],mr:["अनेक दात पडलेले असणे","जास्त मजबूत व न हलणारी कवळी हवी असल्यास"]},keyHighlights:{en:["Rigid thin metal framework","Clasp retention to natural teeth","Long-term dimensional stability"],mr:["पातळ व मजबूत धातू फ्रेम","नैसर्गिक दातांचा आधार","दीर्घकाळ टिकाऊ"]},iconName:"Shield"},{id:"flexible-dentures",name:"Flexible Dentures",nameMarathi:"फ्लेक्सीबल कवळी (Flexible Dentures)",category:"implantology",shortDescription:{en:"Lightweight, unbreakable thermoplastic nylon dentures with gum-colored clasps for maximum comfort.",mr:"अतिशय लवचिक, न तुटणारी, हलकी आणि हिरड्यांच्या रंगाची लवचिक कवळी."},fullDescription:{en:"Manufactured from biocompatible nylon thermoplastic, eliminating metal clasps and offering unmatched flexibility, lightweight comfort, and seamless aesthetic blending with gum tissues.",mr:"धातूची क्लिप नसलेली, लवचिक असल्यामुळे तोंडाला न टोचणारी आणि निसरडी नसलेली आधुनिक कवळी."},indications:{en:["Single or multiple missing teeth","Allergy to metal or rigid acrylic","Desire for lightweight discreet partial"],mr:["काही दात नसणे","धातूची ॲलर्जी असणे","अतिशय हलकी कवळी हवी असल्यास"]},keyHighlights:{en:["Unbreakable thermoplastic","No visible metal clasps","Su
